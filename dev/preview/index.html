<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LumiAH preview</title>
    <style>
      /* A stand-in for Lumiverse's own page, as its drawer lays an extension's tab out
         (frontend/src/components/panels/ViewportDrawer.module.css at the commit LumiAH targets):
         a 56 px rail of tabs beside the panel on a desktop, a row of them above it on a phone; the
         panel's header; and the panel's content, which scrolls the tab's root and pads it 12 px.
         main.ts applies the host theme's --lumiverse-* variables (?theme=dark|light). */
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--lumiverse-bg-deep); color: var(--lumiverse-text); font: 14px/1.45 var(--lumiverse-font-family, system-ui, sans-serif); overflow: hidden; }
      button, select { font: inherit; }
      .ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
      #app { display: flex; height: 100%; }
      #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      #chat header { padding: 12px 16px; border-bottom: 1px solid var(--lumiverse-border); font-weight: 600; display: flex; align-items: center; gap: 8px; }
      #chat-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
      .msg { max-width: 640px; padding: 10px 12px; border-radius: 14px; background: var(--lumiverse-bg); border: 1px solid var(--lumiverse-border); white-space: pre-wrap; }
      .msg.user { align-self: flex-end; background: var(--lumiverse-primary-015); }
      .msg .who { font-size: 12px; color: var(--lumiverse-text-muted); margin-bottom: 4px; }
      #composer { border-top: 1px solid var(--lumiverse-border); padding: 8px 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      #composer .grow { flex: 1; min-width: 120px; min-height: 40px; border-radius: 12px; border: 1px solid var(--lumiverse-border); background: var(--lumiverse-fill); color: var(--lumiverse-text-muted); padding: 10px; }
      .host-btn { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--lumiverse-border); background: var(--lumiverse-fill-subtle); color: inherit; cursor: pointer; }
      .host-btn.primary { background: var(--lumiverse-primary); color: var(--lumiverse-primary-contrast); border-color: transparent; }
      #controls { border-top: 1px dashed var(--lumiverse-border); padding: 8px 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--lumiverse-text-muted); }
      #controls select, #controls button { min-height: 32px; border-radius: 8px; border: 1px solid var(--lumiverse-border); background: var(--lumiverse-fill-subtle); color: var(--lumiverse-text); padding: 0 8px; }
      /* The drawer: the rail of tabs, then the panel. */
      #drawer { --drawer-panel-w: min(420px, calc(100vw - 64px)); width: var(--drawer-panel-w); height: 100%; display: flex; flex: none; position: relative; background: var(--lumiverse-bg-deep); box-shadow: var(--lumiverse-shadow-xl); isolation: isolate; }
      #drawer[data-open="false"] { display: none; }
      #drawer-resize { position: absolute; inset-block: 0; left: 0; width: 8px; z-index: 10; cursor: col-resize; touch-action: none; }
      #drawer-resize:hover { background: var(--lumiverse-primary-020); box-shadow: inset 2px 0 var(--lumiverse-primary); }
      #host-tabs { display: flex; flex-direction: column; width: 56px; flex: none; padding: 6px 0; gap: 4px; align-items: center; background: color-mix(in srgb, var(--lumiverse-primary) 6%, var(--lumiverse-bg-deep)); border-right: 1px solid var(--lumiverse-primary-020); }
      #host-tabs button { width: 44px; height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; border-radius: 8px; background: transparent; color: var(--lumiverse-text-muted); padding: 0; position: relative; cursor: pointer; }
      #host-tabs button span { font-size: 9px; line-height: 1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #host-tabs button[data-active="true"] { color: var(--lumiverse-text); box-shadow: inset 3px 0 0 var(--lumiverse-primary); background: var(--lumiverse-primary-010); }
      #host-tab-badge { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--lumiverse-primary); color: var(--lumiverse-primary-contrast); font-size: 10px; line-height: 16px; text-align: center; }
      #drawer-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: clip; background: var(--lumiverse-bg); }
      .drawer-title { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; min-height: 48px; flex: none; font-size: 15px; font-weight: 600; border-bottom: 1px solid var(--lumiverse-primary-015); }
      #drawer-close { display: inline-flex; width: 32px; height: 32px; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: transparent; color: var(--lumiverse-text-muted); cursor: pointer; }
      /* The host's panel content (ViewportDrawer's .panelContent). */
      #drawer-panel > [data-tab] { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; padding: 12px 12px 0; position: relative; }
      #drawer-open { display: none; position: fixed; top: 8px; right: 8px; z-index: 5; }
      body[data-drawer="closed"] #drawer-open { display: inline-flex; }
      /* The host's confirmation, in the page so it can be answered here. */
      #confirm { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--lumiverse-modal-backdrop, rgba(0, 0, 0, 0.6)); }
      #confirm[hidden] { display: none; }
      #confirm-box { width: min(420px, 100%); padding: 16px; border-radius: 14px; background: var(--lumiverse-bg-elevated); border: 1px solid var(--lumiverse-border); display: flex; flex-direction: column; gap: 12px; }
      #confirm-title { font-weight: 600; font-size: 16px; }
      #confirm-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
      @media (max-width: 600px) {
        /* Like the host on a phone: the open drawer spans the viewport, its tabs in a row above the panel. */
        #drawer { position: fixed; inset: 0; width: 100% !important; flex-direction: column; z-index: 60; }
        #drawer-resize { display: none; }
        #host-tabs { flex-direction: row; width: 100%; padding: 8px; gap: 2px; border-right: 0; border-bottom: 1px solid var(--lumiverse-primary-020); }
        #host-tabs button { width: 52px; height: 48px; }
        #host-tabs button[data-active="true"] { box-shadow: inset 0 -3px 0 var(--lumiverse-primary); border-radius: 8px 8px 0 0; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="chat">
        <header><span id="chat-name">Mara at the harbour</span></header>
        <div id="messages"></div>
        <div id="composer">
          <div class="grow">Type a message…</div>
          <button class="host-btn primary" id="send" type="button">Send</button>
        </div>
        <div id="controls" aria-label="Preview controls">
          <span>Preview:</span>
          <select id="pick-chat" aria-label="The chat open in the host"></select>
          <select id="pick-scenario" aria-label="Scenario">
            <option value="ready">set up</option>
            <option value="fresh">first time</option>
            <option value="trouble">trouble</option>
          </select>
          <button id="link-runtime" type="button">A runtime links</button>
          <button id="drop-push" type="button">Lose the next live push</button>
          <button id="toggle-theme" type="button">Light / dark</button>
          <button id="toggle-pointer" type="button">Touch / mouse</button>
        </div>
      </main>
      <button class="host-btn" id="drawer-open" type="button" aria-label="Open the drawer">LumiAH</button>
      <aside id="drawer" data-open="true">
        <div id="drawer-resize" role="separator" aria-orientation="vertical" aria-label="Resize the drawer"></div>
        <nav id="host-tabs" aria-label="Host tabs">
          <button type="button" aria-label="Profile"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5" /><path d="M5 20c1-3.5 3.8-5 7-5s6 1.5 7 5" /></svg><span>Profile</span></button>
          <button type="button" aria-label="Preset"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></svg><span>Preset</span></button>
          <button type="button" aria-label="Connect"><svg class="ico" viewBox="0 0 24 24"><path d="M9 3v4M15 3v4M7 7h10v4a5 5 0 0 1-10 0zM12 16v5" /></svg><span>Connect</span></button>
          <button type="button" id="host-tab" data-active="true" aria-label="LumiAH"><span id="host-tab-icon"></span><span id="host-tab-name">LumiAH</span><span id="host-tab-badge" hidden></span></button>
        </nav>
        <div id="drawer-panel">
          <div class="drawer-title"><span id="drawer-title-text">Extension</span><button id="drawer-close" type="button" aria-label="Close the drawer"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button></div>
        </div>
      </aside>
    </div>
    <div id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div id="confirm-box">
        <div id="confirm-title"></div>
        <div id="confirm-message"></div>
        <div id="confirm-actions">
          <button class="host-btn" id="confirm-no" type="button">Cancel</button>
          <button class="host-btn primary" id="confirm-yes" type="button">Confirm</button>
        </div>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
